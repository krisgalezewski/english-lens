name: Weekly News Fetch

on:
  schedule:
    # 05:30 UTC = 07:30 Warsaw (CEST, summer UTC+2)
    # In winter (CET, UTC+1) this runs at 06:30 Warsaw — adjust if needed
    - cron: '30 5 * * 1'

  # Allow manual trigger from GitHub Actions tab (useful for testing)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Fetch and summarise news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node fetch-news.js

      - name: Fetch and process videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node fetch-videos.js
        continue-on-error: true  # don't fail the whole run if video fetch has issues

      - name: Commit updated data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "English Lens Bot"
          git add news.json videos.json
          git diff --staged --quiet || git commit -m "Weekly update — $(date +'%Y-%m-%d')"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
