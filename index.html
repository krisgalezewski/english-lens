<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Lens — News for Learners</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0f0f0e;
      --ink-soft: #3a3935;
      --ink-muted: #7a7870;
      --paper: #f7f5f0;
      --paper-warm: #ede9e1;
      --paper-card: #ffffff;
      --rule: #d8d4cc;
      --accent: #c84b2f;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── MASTHEAD ── */
    .masthead {
      background: var(--ink);
      color: var(--paper);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--accent);
    }
    .masthead-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .masthead-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--paper);
      white-space: nowrap;
    }
    .masthead-title span { color: var(--accent); }
    .masthead-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .masthead-edition {
      font-size: 11px;
      color: #8a8780;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .masthead-count {
      font-size: 11px;
      color: #6a6864;
    }

    /* ── CATEGORY BAR ── */
    .cat-bar {
      background: var(--paper-warm);
      border-bottom: 1px solid var(--rule);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
    }
    .cat-btn {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 11px 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, border-color 0.15s;
    }
    .cat-btn:hover { color: var(--ink); }
    .cat-btn.active { color: var(--ink); border-bottom-color: var(--accent); }

    /* ── PAGE ── */
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }

    /* ── EDITION BLOCK ── */
    .edition-block { margin-bottom: 56px; }

    .edition-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--ink);
    }
    .edition-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--ink-muted);
    }
    .edition-date {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
    }
    .edition-pill {
      font-size: 10px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--accent);
      color: white;
      letter-spacing: 0.04em;
      margin-left: auto;
    }

    /* ── CATEGORY SECTION ── */
    .cat-section { margin-bottom: 40px; }
    .cat-section-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .cat-section-head h3 {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--ink-muted);
      white-space: nowrap;
    }
    .cat-section-head::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
    }

    /* ── ARTICLE CARD ── */
    .card {
      background: var(--paper-card);
      padding: 22px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
    }
    .card:hover { background: #fdfcfa; }

    .card-cat {
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 2px;
      display: inline-block;
      align-self: flex-start;
    }
    .cat-politics    .card-cat { background: #e8f0f7; color: #1a4a6b; }
    .cat-technology  .card-cat { background: #e8f2ec; color: #2d5a3d; }
    .cat-environment .card-cat { background: #ecf2e8; color: #4a6b2d; }
    .cat-culture     .card-cat { background: #f2e8f0; color: #6b2d5a; }
    .cat-business    .card-cat { background: #f7f0e8; color: #6b4a1a; }

    .card-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
      color: var(--ink);
    }
    .card-source {
      font-size: 12px;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-source::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .card-preview {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.6;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-cta {
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-top: 6px;
      border-top: 1px solid var(--rule);
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15,15,14,0.75);
      z-index: 200;
      overflow-y: auto;
      padding: 24px 16px;
    }
    .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
    .modal-wrapper { position: relative; width: 100%; max-width: 740px; margin: auto; }
    .modal {
      background: var(--paper-card);
      width: 100%;
      border-radius: 4px;
      overflow: hidden;
      animation: slideUp 0.22s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-head {
      padding: 28px 28px 20px;
      border-bottom: 1px solid var(--rule);
    }
    .modal-head .card-cat { margin-bottom: 12px; }
    .modal-title {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .modal-byline {
      font-size: 12px;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .modal-byline a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .modal-byline a:hover { text-decoration: underline; }

    .modal-body { padding: 24px 28px 32px; }

    /* Level tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 24px;
    }
    .tab-btn {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--ink-muted);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); }
    .tab-btn:hover { color: var(--ink); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .level-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 2px;
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .level-b1 { background: #e8f2ec; color: #2d5a3d; }
    .level-b2 { background: #e8f0f7; color: #1a4a6b; }

    .summary-text {
      font-size: 15px;
      line-height: 1.8;
      color: var(--ink-soft);
    }
    /* Highlighted word in summary */
    .summary-text mark {
      background: #fff0a0;
      color: var(--ink);
      border-radius: 2px;
      padding: 0 2px;
      transition: background 0.3s;
    }
    .summary-text mark.highlight-flash {
      background: #ffd700;
    }

    /* Vocab */
    .vocab-heading {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--ink-muted);
      margin: 28px 0 12px;
      padding-top: 20px;
      border-top: 1px solid var(--rule);
    }
    .vocab-list { display: flex; flex-direction: column; gap: 8px; }
    .vocab-item {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 10px 14px;
      background: var(--paper);
      border-radius: 2px;
      border-left: 3px solid var(--accent);
      cursor: pointer;
      transition: background 0.15s;
    }
    .vocab-item:hover { background: #eeeae0; }
    .vocab-item.active {
      background: #fff8dc;
      border-left-color: #c8960f;
    }
    .vocab-word {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 600;
      font-size: 14px;
      color: var(--ink);
      min-width: 140px;
      flex-shrink: 0;
    }
    .vocab-def {
      font-size: 13.5px;
      color: var(--ink-soft);
      line-height: 1.5;
      flex: 1;
    }
    /* Audio button */
    .vocab-audio {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: var(--paper-warm);
      color: var(--ink-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: background 0.15s, color 0.15s;
    }
    .vocab-audio:hover { background: var(--accent); color: white; }
    .vocab-audio.speaking { background: var(--accent); color: white; }

    .modal-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 34px;
      height: 34px;
      border: none;
      background: var(--ink);
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      color: var(--paper);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-close:hover { background: var(--accent); }

    /* ── LOADING / EMPTY ── */
    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      color: var(--ink-muted);
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    .empty-cat {
      background: var(--paper-card);
      border: 1px solid var(--rule);
      padding: 40px;
      text-align: center;
      color: var(--ink-muted);
      font-size: 14px;
      margin-bottom: 40px;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--ink);
      color: #6a6864;
      font-size: 12px;
      text-align: center;
      padding: 24px;
      line-height: 1.9;
    }
    footer strong { color: #9a9895; }
    footer a { color: #8a8780; }

    @media (max-width: 640px) {
      .masthead-title { font-size: 21px; }
      .modal-title { font-size: 20px; }
      .modal-head, .modal-body { padding-left: 18px; padding-right: 18px; }
      .vocab-item { flex-direction: column; gap: 4px; }
      .vocab-word { min-width: unset; }
      .modal-close { top: -12px; right: -4px; }
    }
  </style>
</head>
<body>

<header class="masthead" role="banner">
  <div class="masthead-inner">
    <div class="masthead-title">English<span>Lens</span></div>
    <div class="masthead-right">
      <div class="masthead-edition" id="week-label">Loading…</div>
      <div class="masthead-count" id="article-count"></div>
    </div>
  </div>
</header>

<nav class="cat-bar" aria-label="Filter by category">
  <div class="cat-inner">
    <button class="cat-btn active" data-cat="all">All</button>
    <button class="cat-btn" data-cat="politics">Politics</button>
    <button class="cat-btn" data-cat="business">Business</button>
    <button class="cat-btn" data-cat="technology">Technology</button>
    <button class="cat-btn" data-cat="environment">Environment</button>
    <button class="cat-btn" data-cat="culture">Culture</button>
  </div>
</nav>

<main class="page" id="main-content">
  <div id="loading" aria-live="polite">Loading articles…</div>
</main>

<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title-text">
  <div class="modal-wrapper">
    <button class="modal-close" id="modal-close" aria-label="Close article">✕</button>
    <div class="modal" id="modal">
      <div class="modal-head" id="modal-head"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
</div>

<footer>
  <strong>EnglishLens</strong> — curated weekly for English learners in Poland<br>
  Made with care by <strong>Kris</strong> · for Kris's students 🎓<br>
  <span style="font-size:11px;">Sources: BBC News · Reuters · Euronews · Politico Europe · Notes from Poland · The Guardian · Financial Times</span>
</footer>

<script>
  const CAT_LABELS = {
    politics: 'Politics', technology: 'Technology',
    environment: 'Environment', culture: 'Culture', business: 'Business'
  };

  let allEditions = [];   // [{generated, week, articles:[...]}, ...]
  let activeCategory = 'all';

  // ── LOAD ──────────────────────────────────────────────────────────────────

  async function loadNews() {
    try {
      const res = await fetch('news.json?v=' + Date.now());
      const data = await res.json();

      // Support both new archive format and old single-edition format
      if (data.editions) {
        allEditions = data.editions;
      } else if (data.articles) {
        allEditions = [{ generated: data.generated, week: data.week, articles: data.articles }];
      }

      const latest = allEditions[0];
      if (latest) {
        const raw = (latest.generated || '').replace(/\+\d{2}:\d{2}$/, 'Z');
        const d = new Date(raw);
        const label = isNaN(d.getTime())
          ? (latest.week || 'Latest edition')
          : 'Week of ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('week-label').textContent = label;
      }

      const total = allEditions.reduce((n, e) => n + (e.articles || []).length, 0);
      document.getElementById('article-count').textContent =
        total + ' article' + (total !== 1 ? 's' : '') + ' in archive';

      renderArticles();
    } catch (e) {
      document.getElementById('loading').textContent =
        'Could not load articles. Please check your connection and refresh.';
    }
  }

  // ── RENDER ────────────────────────────────────────────────────────────────

  function renderArticles() {
    const main = document.getElementById('main-content');
    let html = '';
    let totalShown = 0;

    allEditions.forEach((edition, ei) => {
      const articles = (edition.articles || []).filter(a =>
        activeCategory === 'all' || a.category === activeCategory
      );
      if (!articles.length) return;

      const d = new Date(edition.generated);
      const dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      const isLatest = ei === 0;

      html += `<div class="edition-block">`;
      html += `<div class="edition-header">
        <span class="edition-label">Edition</span>
        <span class="edition-date">${dateStr}</span>
        ${isLatest ? '<span class="edition-pill">Latest</span>' : ''}
      </div>`;

      // Group by category within this edition
      const byCat = {};
      articles.forEach(a => {
        if (!byCat[a.category]) byCat[a.category] = [];
        byCat[a.category].push(a);
      });

      Object.keys(byCat).forEach(cat => {
        const arts = byCat[cat];
        html += `<div class="cat-section">`;
        if (activeCategory === 'all') {
          html += `<div class="cat-section-head"><h3>${CAT_LABELS[cat] || cat}</h3></div>`;
        }
        html += `<div class="grid">`;
        arts.forEach(a => {
          html += `<article class="card cat-${escAttr(a.category)}"
            data-edition="${ei}" data-id="${escAttr(a.id)}"
            tabindex="0" role="button"
            aria-label="Read: ${escAttr(a.title)}">
            <span class="card-cat">${CAT_LABELS[a.category] || a.category}</span>
            <h3 class="card-title">${escHtml(a.title)}</h3>
            <div class="card-source">${escHtml(a.source)} · ${formatDate(a.date)}</div>
            <p class="card-preview">${escHtml(a.summaryB1 || '')}</p>
            <div class="card-cta">Read with summaries →</div>
          </article>`;
          totalShown++;
        });
        html += `</div></div>`;
      });

      html += `</div>`;
    });

    if (!totalShown) {
      html = `<div class="empty-cat">No articles found${activeCategory !== 'all' ? ' in this category' : ''}.</div>`;
    }

    main.innerHTML = html;

    main.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => openModal(+card.dataset.edition, card.dataset.id));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(+card.dataset.edition, card.dataset.id); }
      });
    });
  }

  // ── MODAL ─────────────────────────────────────────────────────────────────

  function openModal(editionIdx, id) {
    const edition = allEditions[editionIdx];
    if (!edition) return;
    const a = (edition.articles || []).find(x => x.id === id);
    if (!a) return;

    document.getElementById('modal-head').innerHTML = `
      <span class="card-cat" style="${catStyle(a.category)}">${CAT_LABELS[a.category] || a.category}</span>
      <h2 class="modal-title" id="modal-title-text">${escHtml(a.title)}</h2>
      <div class="modal-byline">
        <span>${escHtml(a.source)}</span>
        <span>${formatDate(a.date)}</span>
        <a href="${escAttr(a.originalUrl)}" target="_blank" rel="noopener noreferrer">Read original article ↗</a>
      </div>`;

    // Build summary HTML with each vocab word wrapped in a <mark> span
    function buildSummaryHtml(text, vocabItems) {
      if (!vocabItems || !vocabItems.length) return escHtml(text);
      let html = escHtml(text);
      // Sort by length descending so longer phrases match before shorter substrings
      const sorted = [...vocabItems].sort((a, b) => b.word.length - a.word.length);
      sorted.forEach((v, idx) => {
        const escaped = escHtml(v.word);
        // Case-insensitive replace of first occurrence, whole word/phrase preferred
        const regex = new RegExp(escaped.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
        html = html.replace(regex, match =>
          `<mark class="vocab-mark" data-vocab-idx="${idx}" data-word="${escaped}">${match}</mark>`
        );
      });
      return html;
    }

    function vocabBlock(items, panelId) {
      if (!items || !items.length) return '';
      const hasSpeech = 'speechSynthesis' in window;
      return `<div class="vocab-heading">Key vocabulary <span style="font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;">(click a word to find it in the text)</span></div>
        <div class="vocab-list">
          ${items.map((v, idx) => `<div class="vocab-item" data-panel="${panelId}" data-idx="${idx}" tabindex="0" role="button" aria-label="Highlight ${escHtml(v.word)} in summary">
            <span class="vocab-word">${escHtml(v.word)}</span>
            <span class="vocab-def">${escHtml(v.definition)}</span>
            ${hasSpeech ? `<button class="vocab-audio" data-word="${escHtml(v.word)}" aria-label="Hear pronunciation of ${escHtml(v.word)}" title="Listen">🔊</button>` : ''}
          </div>`).join('')}
        </div>`;
    }

    document.getElementById('modal-body').innerHTML = `
      <div class="tabs" role="tablist">
        <button class="tab-btn active" role="tab" aria-selected="true" data-tab="b1">B1 — Intermediate</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="b2">B2–C1 — Upper Intermediate</button>
      </div>
      <div class="tab-panel active" id="tab-b1" role="tabpanel">
        <span class="level-badge level-b1">B1 · Intermediate</span>
        <p class="summary-text" id="summary-b1">${buildSummaryHtml(a.summaryB1 || '', a.vocabularyB1)}</p>
        ${vocabBlock(a.vocabularyB1, 'b1')}
      </div>
      <div class="tab-panel" id="tab-b2" role="tabpanel">
        <span class="level-badge level-b2">B2–C1 · Upper Intermediate</span>
        <p class="summary-text" id="summary-b2">${buildSummaryHtml(a.summaryB2 || '', a.vocabularyB2)}</p>
        ${vocabBlock(a.vocabularyB2, 'b2')}
      </div>`;

    // Tab switching
    document.getElementById('modal-body').querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#modal-body .tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
        document.querySelectorAll('#modal-body .tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // Vocab item click → highlight word in summary
    document.getElementById('modal-body').querySelectorAll('.vocab-item').forEach(item => {
      function activate() {
        const panel = item.dataset.panel;
        const idx = item.dataset.idx;
        const summaryEl = document.getElementById('summary-' + panel);
        // Clear previous highlights
        document.querySelectorAll(`#summary-${panel} .vocab-mark`).forEach(m => m.classList.remove('highlight-flash'));
        document.querySelectorAll(`.vocab-item[data-panel="${panel}"]`).forEach(i => i.classList.remove('active'));
        // Find matching mark
        const mark = summaryEl ? summaryEl.querySelector(`.vocab-mark[data-vocab-idx="${idx}"]`) : null;
        if (mark) {
          item.classList.add('active');
          mark.classList.add('highlight-flash');
          mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
          // Flash effect
          setTimeout(() => mark.classList.remove('highlight-flash'), 1800);
          setTimeout(() => mark.classList.add('highlight-flash'), 2100);
          setTimeout(() => mark.classList.remove('highlight-flash'), 3000);
        }
      }
      item.addEventListener('click', e => {
        if (e.target.closest('.vocab-audio')) return; // don't trigger on audio btn
        activate();
      });
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
      });
    });

    // Audio buttons → Web Speech API
    if ('speechSynthesis' in window) {
      // Find the best available female British English voice
      function getBritishFemaleVoice() {
        const voices = window.speechSynthesis.getVoices();
        // Preference order: named UK female voices first, then any en-GB, then any en
        const preferred = [
          'Google UK English Female',
          'Microsoft Hazel Desktop - English (Great Britain)',
          'Microsoft Susan Desktop - English (Great Britain)',
          'Karen',   // macOS/iOS Australian — close accent, female
          'Serena',  // macOS British female
          'Martha',  // macOS British female
          'Moira',   // macOS Irish female — acceptable fallback
        ];
        for (const name of preferred) {
          const match = voices.find(v => v.name === name);
          if (match) return match;
        }
        // Fallback: any female-sounding en-GB voice
        const gbFemale = voices.find(v => v.lang === 'en-GB' && /female|woman/i.test(v.name));
        if (gbFemale) return gbFemale;
        // Fallback: any en-GB voice
        const gb = voices.find(v => v.lang === 'en-GB');
        if (gb) return gb;
        // Last resort: any English voice
        return voices.find(v => v.lang.startsWith('en')) || null;
      }

      document.getElementById('modal-body').querySelectorAll('.vocab-audio').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const word = btn.dataset.word;
          window.speechSynthesis.cancel();
          if (btn.classList.contains('speaking')) {
            btn.classList.remove('speaking');
            return;
          }
          document.querySelectorAll('.vocab-audio.speaking').forEach(b => b.classList.remove('speaking'));
          const utt = new SpeechSynthesisUtterance(word);
          utt.lang = 'en-GB';
          utt.rate = 0.85;
          // Voices may not be loaded yet — wait if needed
          const setVoiceAndSpeak = () => {
            const voice = getBritishFemaleVoice();
            if (voice) utt.voice = voice;
            btn.classList.add('speaking');
            utt.onend = () => btn.classList.remove('speaking');
            utt.onerror = () => btn.classList.remove('speaking');
            window.speechSynthesis.speak(utt);
          };
          if (window.speechSynthesis.getVoices().length) {
            setVoiceAndSpeak();
          } else {
            window.speechSynthesis.onvoiceschanged = setVoiceAndSpeak;
          }
        });
      });
    }

    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('modal-overlay').scrollTop = 0;
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ── CATEGORY FILTER ───────────────────────────────────────────────────────

  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      renderArticles();
    });
  });

  // ── HELPERS ───────────────────────────────────────────────────────────────

  function catStyle(cat) {
    const s = {
      politics:    'background:#e8f0f7;color:#1a4a6b',
      technology:  'background:#e8f2ec;color:#2d5a3d',
      environment: 'background:#ecf2e8;color:#4a6b2d',
      culture:     'background:#f2e8f0;color:#6b2d5a',
      business:    'background:#f7f0e8;color:#6b4a1a',
    };
    return s[cat] || '';
  }

  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str + 'T12:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escAttr(str) {
    return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  loadNews();
</script>
</body>
</html>
