name: Generate Vocabulary Audio

# Manual run: creates any missing pronunciation MP3s for the whole news.json
# archive (without fetching a new edition). The weekly workflow does this
# automatically for new words; use this for the first backfill or after
# changing the voice.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate vocabulary pronunciation audio
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: node generate-audio.js

      - name: Commit audio and news.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "English Lens Bot"
          git add news.json audio/
          git diff --staged --quiet || git commit -m "Vocabulary audio — $(date +'%Y-%m-%d')"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
